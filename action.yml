name: 'Odin Scan - Smart Contract Security'
description: 'AI-powered smart contract security analysis for CosmWasm, Solana, and EVM'
author: 'Odin Scan'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  api-key:
    description: 'Odin Scan API key (odin_sk_*)'
    required: true
  platform:
    description: 'Target platform: auto, cosmwasm, solana, evm'
    required: false
    default: 'auto'
  severity-threshold:
    description: 'Fail at this severity or above: critical, high, medium, low, none'
    required: false
    default: 'high'
  fail-on-findings:
    description: 'Whether to fail the workflow when findings exceed threshold'
    required: false
    default: 'true'
  comment-on-pr:
    description: 'Post summary comment on pull requests'
    required: false
    default: 'true'
  findings-visibility:
    description: 'Detail level for public PR output: full (all details), counts (severity table only), private (no details, link only)'
    required: false
    default: 'full'
  upload-sarif:
    description: 'Upload SARIF to GitHub Code Scanning'
    required: false
    default: 'true'
  upload-artifact:
    description: 'Upload full report as workflow artifact'
    required: false
    default: 'true'
  timeout:
    description: 'Max wait for analysis completion (seconds)'
    required: false
    default: '1800'
  github-token:
    description: 'GitHub token for PR comments, SARIF upload, and private repo cloning'
    required: false
    default: ${{ github.token }}
  api-url:
    description: 'Odin Scan API base URL'
    required: false
    default: 'https://api.odinscan.ai'

outputs:
  analysis-id:
    description: 'The analysis ID'
  status:
    description: 'Analysis status (completed, failed)'
  total-findings:
    description: 'Total number of findings'
  critical-count:
    description: 'Number of critical findings'
  high-count:
    description: 'Number of high findings'
  medium-count:
    description: 'Number of medium findings'
  low-count:
    description: 'Number of low findings'
  report-url:
    description: 'URL to the full report on Odin Scan'
  sarif-file:
    description: 'Path to generated SARIF file'

runs:
  using: 'node20'
  main: 'dist/index.js'
